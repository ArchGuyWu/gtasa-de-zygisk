name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches module version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' gtasa-de-zygisk/module.prop)"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$version" != "$tag" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match module.prop version ${version}" >&2
            exit 1
          fi

      - name: Build
        run: bash gtasa-de-zygisk/build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=$(printf '%s\n\n%s\n' \
            "Zygisk module and NPatch module for GTASA DE ${GITHUB_REF_NAME}." \
            "GTASA DE ${GITHUB_REF_NAME} 的 Zygisk 模块和 NPatch 模块。")
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes" \
            "gtasa-de-zygisk/dist/gtasa-de-zygisk-${GITHUB_REF_NAME#v}-arm64.zip" \
            "gtasa-de-zygisk/dist/gtasa-de-zygisk-${GITHUB_REF_NAME#v}-npatch.apk"
